server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;  # Radix Themes CSS is ~700 KB raw, ~80 KB gzipped
    gzip_types text/css application/javascript;

    # nginx defaults (1 MB body, 60 s timeout) would reject 8 MB uploads and cut off slow Gemma calls
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_buffering off;  # pass the explainer's NDJSON stream through as it arrives
        proxy_set_header X-Real-IP $remote_addr;  # the visitor's IP, for the backend's rate limit (overwrites any client-sent value)
    }

    location / {
        try_files $uri /index.html;
    }
}
